<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfbfa" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong palette.
      // tokens.css relies on this always stamping data-theme, so storage
      // failures (private mode, blocked cookies) fall back to the OS setting.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#171315');
        }
      })();
    </script>
    <meta
      name="description"
      content="Melly Marcelia, digital experience design student based in Brussels. UI/UX, front-end development, and interactive experiences."
    />
    <title>Melly Marcelia | Digital Experience Design Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Epilogue:wght@400;500;600;700;800&family=Homemade+Apple&family=Seaweed+Script&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Sansita:wght@400;700;900&family=Asap:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
